<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>쿠팡으로 이동</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background-color: #f4f5f7;
      padding: 20px;
    }
    .container {
      background: #ffffff;
      padding: 36px 24px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
      max-width: 340px;
      width: 100%;
      text-align: center;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 19px;
      color: #111111;
      font-weight: 700;
    }
    p {
      margin: 0 0 24px 0;
      font-size: 14px;
      color: #666666;
      line-height: 1.5;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 16px 0;
      background-color: #0073e9;
      color: #ffffff;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 115, 233, 0.35);
    }
    .guide {
      margin-top: 20px;
      font-size: 12px;
      color: #999999;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>쿠팡 최저가 확인</h2>
    <p>아래 버튼을 누르면<br>쿠팡 앱 해당 상품으로 이동합니다.</p>

    <button id="goBtn" class="btn" onclick="openDirect()">쿠팡 앱에서 바로보기</button>

    <div class="guide">
      앱이 열리지 않을 경우<br>
      우측 상단 <b>[···]</b> 누르고 <b>[기본 브라우저로 열기]</b>를 선택해 주세요.
    </div>
  </div>

  <script>
    var productId = "9749293489";
    var webUrl = "https://www.coupang.com/vp/products/" + productId;

    function openDirect() {
      var ua = navigator.userAgent.toLowerCase();

      // 1. 안드로이드: 공식 인텐트(Intent)로 패키지 지정 실행 (홈이 아니라 무조건 상세로 감)
      if (ua.indexOf("android") > -1) {
        var intentUrl = "intent://www.coupang.com/vp/products/" + productId + "#Intent;scheme=https;package=com.coupang.mobile;end";
        location.href = intentUrl;
        return;
      }

      // 2. 아이폰(iOS): 쿠팡 v1 상품 상세 직접 호출 스키마
      var iosAppUrl = "coupang://productDetail?productId=" + productId;

      var clickedAt = +new Date();
      location.href = iosAppUrl;

      // 앱 실행 실패 시 웹페이지로 폴백
      setTimeout(function() {
        if (+new Date() - clickedAt < 2000) {
          location.href = webUrl;
        }
      }, 1000);
    }
  </script>
</body>
</html>
